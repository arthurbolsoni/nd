<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>CEP</title></head>
<body>
<button id="cep">Consultar CEP</button>
<p id="res"></p>
<script>
  document.getElementById('cep').onclick = async () => {
    const r = await fetch('/api/eco?cep=01310', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ cep: '01310-100' }),
    });
    document.getElementById('res').textContent = 'cep ' + (await r.json()).metodo;
  };
</script>
</body></html>

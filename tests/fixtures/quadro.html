<!doctype html>
<html><head><meta charset="utf-8"><title>Quadro externo</title></head>
<body>
<form onsubmit="event.preventDefault(); document.getElementById('saida').textContent = 'externo: ' + document.getElementById('cep').value + ' ' + [...document.getElementById('doc').files].map((f) => f.name).join(',');">
  <label for="cep">CEP</label>
  <input id="cep">
  <input id="doc" type="file">
  <button type="submit">Enviar externo</button>
</form>
<p id="saida"></p>
</body></html>

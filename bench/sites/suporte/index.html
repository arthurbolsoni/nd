<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Central de Suporte</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #f6f6f8; }
  [hidden] { display: none !important; }
  header { background: #1f2937; color: #fff; padding: 8px 16px; display: flex; gap: 12px; align-items: center; }
  main { padding: 16px; max-width: 820px; margin: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  td, th { border: 1px solid #ddd; padding: 6px; text-align: left; }
  .menu { position: absolute; background: #fff; border: 1px solid #888; padding: 6px; z-index: 3; }
  .menu button { display: block; width: 100%; text-align: left; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .modal > div { background: #fff; padding: 16px; width: 380px; }
  iframe { width: 100%; height: 200px; border: 1px solid #999; }
  details { background: #fff; border: 1px solid #ccc; margin: 6px 0; padding: 6px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: #222; color: #fff; padding: 10px 14px; }
  label { display: block; margin: 8px 0 2px; }
  .tabs button[aria-selected=true] { font-weight: bold; }
</style>
</head>
<body>
<header>
  <strong>Central de Suporte</strong>
  <button onclick="tela('fila')">Fila</button>
  <span style="flex:1"></span>
  <button id="avatar" aria-haspopup="menu" aria-expanded="false" aria-label="Menu do usuário" onclick="$('m-user').hidden=!$('m-user').hidden">AB</button>
  <div class="menu" id="m-user" hidden style="right:16px;top:40px">
    <button onclick="tela('config')">Configurações</button>
    <button onclick="return false">Atalhos de teclado</button>
    <button onclick="return false">Sair</button>
  </div>
</header>
<main>
  <section id="t-fila">
    <h1>Fila de tickets</h1>
    <label for="f-status">Status</label>
    <select id="f-status" onchange="pg=1; fila()">
      <option value="">Todos</option><option>Aberto</option><option>Pendente</option><option>Fechado</option>
    </select>
    <label for="f-busca">Buscar</label>
    <input id="f-busca" oninput="pg=1; fila()">
    <div id="barra" hidden>
      <span id="sel-n"></span>
      <button onclick="$('m-massa').hidden=!$('m-massa').hidden">Ações em massa</button>
      <div class="menu" id="m-massa" hidden><button onclick="massa('Fechado')">Fechar selecionados</button><button onclick="massa('Pendente')">Marcar como pendente</button></div>
    </div>
    <table>
      <thead><tr><th></th><th>#</th><th>Assunto</th><th>Status</th><th>Prioridade</th><th>Responsável</th></tr></thead>
      <tbody id="corpo"></tbody>
    </table>
    <p><button id="ant" onclick="pg--; fila()">Anterior</button> Página <span id="pg-n"></span> de <span id="pg-t"></span> <button id="prox" onclick="pg++; fila()">Próxima</button></p>
  </section>

  <section id="t-ticket" hidden>
    <button onclick="tela('fila')">← Voltar para a fila</button>
    <h1 id="tk-titulo"></h1>
    <p id="tk-info"></p>
    <button id="b-acoes" aria-haspopup="menu" onclick="$('m-acoes').hidden=!$('m-acoes').hidden">Ações</button>
    <div class="menu" id="m-acoes" hidden>
      <button onclick="abrirAtribuir()">Atribuir…</button>
      <button onclick="abrirPrio()">Alterar prioridade…</button>
      <button onclick="abrirFechar()">Fechar ticket…</button>
    </div>
    <h3>Responder ao cliente</h3>
    <iframe id="editor" title="Editor de resposta"></iframe>
    <h3>Histórico</h3>
    <ul id="hist"></ul>
  </section>

  <section id="t-config" hidden>
    <h1>Configurações</h1>
    <div class="tabs" role="tablist">
      <button role="tab" id="c-perfil" aria-selected="true" onclick="cfgAba('perfil')">Perfil</button>
      <button role="tab" id="c-notif" aria-selected="false" onclick="cfgAba('notif')">Notificações</button>
      <button role="tab" id="c-eq" aria-selected="false" onclick="cfgAba('eq')">Equipe</button>
    </div>
    <div id="p-perfil"><p>Nome: Arthur B.</p></div>
    <div id="p-eq" hidden><p>Gestão de equipe indisponível para o seu papel.</p></div>
    <div id="p-notif" hidden>
      <details><summary>Notificações push</summary><label><input type="checkbox" role="switch"> Novos tickets</label></details>
      <details id="d-email"><summary>E-mail</summary>
        <label><input type="checkbox" id="n-resumo" role="switch" checked onchange="notif()"> Resumo diário</label>
        <label><input type="checkbox" id="n-sla" role="switch" onchange="notif()"> Alerta de SLA</label>
        <div id="sla-det" hidden>
          <label for="sla-h">Antecedência do alerta</label>
          <select id="sla-h" onchange="notif()">
            <option value="1">1 hora</option><option value="2">2 horas</option><option value="4">4 horas</option><option value="8">8 horas</option>
          </select>
        </div>
      </details>
      <details><summary>Slack</summary><label><input type="checkbox" role="switch"> Menções</label></details>
    </div>
  </section>
</main>

<div class="modal" id="m-atribuir" hidden role="dialog" aria-label="Atribuir ticket"><div id="atr-corpo"></div></div>
<div class="modal" id="m-prio" hidden role="dialog" aria-label="Alterar prioridade"><div>
  <h3>Prioridade</h3>
  <label><input type="radio" name="prio" value="Baixa"> Baixa</label>
  <label><input type="radio" name="prio" value="Média"> Média</label>
  <label><input type="radio" name="prio" value="Alta"> Alta</label>
  <label><input type="radio" name="prio" value="Urgente"> Urgente</label>
  <p><button onclick="$('m-prio').hidden=true">Cancelar</button> <button onclick="salvarPrio()">Salvar prioridade</button></p>
</div></div>
<div class="modal" id="m-fechar" hidden role="dialog" aria-label="Fechar ticket"><div>
  <h3>Fechar ticket</h3>
  <label for="motivo">Motivo</label>
  <select id="motivo"><option value="">Escolha…</option><option>Resolvido</option><option>Duplicado</option><option>Sem resposta do cliente</option><option>Spam</option></select>
  <p><button onclick="$('m-fechar').hidden=true">Cancelar</button> <button onclick="confirmarFechar()">Confirmar fechamento</button></p>
  <p id="erro-f" role="alert"></p>
</div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
const $ = id => document.getElementById(id);
const ASSUNTOS = ['Erro no login', 'Fatura em atraso', 'Alterar plano', 'Cobrança duplicada', 'Exportar relatório', 'Integração com API', 'Lentidão no painel', 'Cancelamento'];
const AGENTES = ['Paula Reis', 'Paulo Reis', 'Carla Mendes', 'Rafael Dias', 'Paula Rezende'];
const STATUS = ['Aberto', 'Pendente', 'Fechado'];
const TICKETS = [];
for (let i = 0; i < 60; i++) TICKETS.push({ id: 4800 + i + 1, assunto: ASSUNTOS[i % 8], status: STATUS[i % 3], prio: 'Média', resp: '', hist: [] });
// alvo: #4821 'Cobrança duplicada' (pág. 3), iscas: #4803 e #4827 também 'Cobrança duplicada'
TICKETS.forEach(t => { if ([4821, 4803, 4827].includes(t.id)) { t.assunto = 'Cobrança duplicada'; t.status = 'Aberto'; } });
const estado = window.__estado = { tickets: TICKETS, notificacoes: { resumoDiario: true, alertaSla: false, slaHoras: 1 } };
let pg = 1, atual = null, marcados = new Set(), amostra = 10;

function toast(t) { const e = $('toast'); e.textContent = t; e.hidden = false; setTimeout(() => e.hidden = true, 2500); }
function tela(t) {
  $('m-user').hidden = true;
  ['fila', 'ticket', 'config'].forEach(x => $('t-' + x).hidden = x !== t);
  if (t === 'fila') fila();
}
function fila() {
  const st = $('f-status').value, q = $('f-busca').value.toLowerCase();
  const f = TICKETS.filter(t => (!st || t.status === st) && (!q || (t.assunto + ' ' + t.id).toLowerCase().includes(q)));
  const total = Math.max(1, Math.ceil(f.length / amostra)); pg = Math.min(Math.max(1, pg), total);
  $('corpo').innerHTML = f.slice((pg - 1) * amostra, pg * amostra).map(t => `<tr>
    <td><input type="checkbox" aria-label="Selecionar ticket ${t.id}" ${marcados.has(t.id) ? 'checked' : ''} onchange="marcar(${t.id}, this.checked)"></td>
    <td>${t.id}</td><td><a href="#" onclick="abrir(${t.id}); return false;">${t.assunto}</a></td><td>${t.status}</td><td>${t.prio}</td><td>${t.resp || '—'}</td></tr>`).join('');
  $('pg-n').textContent = pg; $('pg-t').textContent = total;
  $('ant').disabled = pg <= 1; $('prox').disabled = pg >= total;
  $('barra').hidden = !marcados.size; $('sel-n').textContent = marcados.size + ' selecionados';
}
function marcar(id, b) { b ? marcados.add(id) : marcados.delete(id); fila(); }
function massa(s) { TICKETS.filter(t => marcados.has(t.id)).forEach(t => t.status = s); marcados.clear(); $('m-massa').hidden = true; fila(); toast('Tickets atualizados'); }
function abrir(id) {
  atual = TICKETS.find(t => t.id === id); tela('ticket'); detalhe();
  $('editor').srcdoc = `<body style="font-family:sans-serif"><label>Resposta <textarea id="r" rows="4" cols="40" aria-label="Resposta"></textarea></label>
    <p><button id="env" onclick="parent.postMessage({tipo:'resposta',texto:document.getElementById('r').value},'*'); document.getElementById('r').value=''">Enviar resposta</button></p></body>`;
}
function detalhe() {
  $('tk-titulo').textContent = '#' + atual.id + ' — ' + atual.assunto;
  $('tk-info').textContent = `Status: ${atual.status} · Prioridade: ${atual.prio} · Responsável: ${atual.resp || 'ninguém'}`;
  $('hist').innerHTML = atual.hist.map(h => `<li>${h}</li>`).join('') || '<li>Sem eventos.</li>';
  $('m-acoes').hidden = true;
}
window.addEventListener('message', e => {
  if (e.data && e.data.tipo === 'resposta' && e.data.texto.trim()) { atual.hist.push('Resposta enviada: ' + e.data.texto); atual.respostas = (atual.respostas || []).concat(e.data.texto); detalhe(); toast('Resposta enviada'); }
});
class ListaAgentes extends HTMLElement {
  connectedCallback() {
    const r = this.attachShadow({ mode: 'open' });
    r.innerHTML = `<label>Buscar agente <input id="q" aria-label="Buscar agente"></label><ul id="ul" style="list-style:none;padding:0"></ul>`;
    const draw = () => { const q = r.getElementById('q').value.toLowerCase(); r.getElementById('ul').innerHTML = AGENTES.filter(a => a.toLowerCase().includes(q)).map(a => `<li><button data-a="${a}">${a}</button></li>`).join(''); r.querySelectorAll('button[data-a]').forEach(b => b.onclick = () => this.dispatchEvent(new CustomEvent('escolheu', { detail: b.dataset.a, bubbles: true, composed: true }))); };
    r.getElementById('q').oninput = draw; draw();
  }
}
customElements.define('lista-agentes', ListaAgentes);
function abrirAtribuir() {
  $('m-acoes').hidden = true; $('m-atribuir').hidden = false;
  $('atr-corpo').innerHTML = '<h3>Atribuir ticket</h3><lista-agentes></lista-agentes><p><button onclick="$(\'m-atribuir\').hidden=true">Cancelar</button></p>';
  $('atr-corpo').querySelector('lista-agentes').addEventListener('escolheu', e => { atual.resp = e.detail; atual.hist.push('Atribuído a ' + e.detail); $('m-atribuir').hidden = true; detalhe(); toast('Atribuído'); });
}
function abrirPrio() { $('m-acoes').hidden = true; $('m-prio').hidden = false; }
function salvarPrio() { const r = document.querySelector('input[name=prio]:checked'); if (!r) return; atual.prio = r.value; atual.hist.push('Prioridade: ' + r.value); $('m-prio').hidden = true; detalhe(); toast('Prioridade atualizada'); }
function abrirFechar() { $('m-acoes').hidden = true; $('m-fechar').hidden = false; $('erro-f').textContent = ''; }
function confirmarFechar() {
  const m = $('motivo').value; if (!m) { $('erro-f').textContent = 'Escolha um motivo'; return; }
  atual.status = 'Fechado'; atual.motivo = m; atual.hist.push('Fechado: ' + m); $('m-fechar').hidden = true; detalhe(); toast('Ticket fechado');
}
function cfgAba(a) { ['perfil', 'notif', 'eq'].forEach(x => { $('p-' + x).hidden = x !== a; $('c-' + x).setAttribute('aria-selected', x === a); }); }
function notif() {
  $('sla-det').hidden = !$('n-sla').checked;
  estado.notificacoes = { resumoDiario: $('n-resumo').checked, alertaSla: $('n-sla').checked, slaHoras: parseInt($('sla-h').value, 10) };
  toast('Preferência salva');
}
fila();
</script>
</body>
</html>
